[package]
name = "rgb-cmd"
version = { workspace = true }
description = "Command-line wallet for RGB smart contracts on Bitcoin, for testing purposes only"
keywords = { workspace = true }
categories = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[[bin]]
name = "rgb"
path = "src/main.rs"

[dependencies]
amplify = { workspace = true }
baid64 = { workspace = true }
rgb-strict-types = { workspace = true, features = [
    "serde",
] }
bp-wallet = { workspace = true, features = [
    "cli",
] }
rgb-ops = { workspace = true, features = [
    "serde",
    "sqlite",
] }
rgb-api = { version = "0.11.2-rc.1", path = "..", features = [
    "cli",
    "electrum_blocking",
    "esplora_blocking",
    "fs",
    "mempool_blocking",
    "serde",
    "sqlite",
] }
rgb-psbt-utils = { workspace = true, features = [
    "bp",
] }
log = { workspace = true }
clap = { version = "4.6.1", features = [
    "derive",
    "env",
] }
serde_crate = { workspace = true }
serde_yaml = { workspace = true }

[dev-dependencies]
assert_cmd = "2.1"
predicates = "3.1"
tempfile = "3"

[features]
default = []
